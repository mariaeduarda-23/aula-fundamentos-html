<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil da Maria</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: beige;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .bio {
            background-color: aliceblue;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            padding: 20px;
        }

        h2 {
            padding: 10px;
        }

        .foto {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto;
        }

        ul {
            list-style: none;
        }

        li {
            padding: 5px;
        }

        a {
            text-decoration: none;
            padding: 5px;
        }

        .logos {
            width: 32px;
            height: 32px;
            object-fit: contain;
            margin: 0 8px;
        }

        .redes {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="bio">

        <h1>Olá, eu sou a Maria</h1>

        <img class="foto" src="foto.png" alt="Minha foto">

        <p>
            Tenho 16 anos, sou estudante
            e gosto de jogar e ouvir músicas.
        </p>

        <h2>Minhas Especialidades</h2>

        <ul>
            <a target="_blank" href="https://www.youtube.com/playlist?list=PLqohAeuW56mj1I6xcvN7n2eNQoF4ZrffD">Jogar</a><br>
            <a target="_blank" href="https://www.youtube.com/watch?v=KMILSpZe7p4">Pintar a Unha</a><br>
        </ul>

        <h2>Meus Hobbies</h2>

        <ul>
            <li>Treinar</li>
            <li>Jogar</li>
            <li>Viajar</li>
        </ul>

        <div class="redes">

            <a href="https://github.com/mariaeduarda-23" target="_blank">
                <img class="logos" src="github.png" alt="GitHub">
            </a>

            <a href="https://www.linkedin.com/in/maria-eduarda-boldrin-pavan-910556409/" target="_blank">
                <img class="logos" src="linkedin.png" alt="LinkedIn">
            </a>

        </div>

    </div>

</body>

</html>
