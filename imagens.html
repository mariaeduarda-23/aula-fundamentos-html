<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens </title>
</head>
<style>
    .img-pequena {
        width: 30%;
        height: 300px;
    }
    .img-destaque {
        height: 400px;
        width: 100%;
        object-fit:contain;
    }
    img {
        border-radius: 50px;
        border: 10px dashed beige;
    }
    .div-images {
        margin-top: 20px; 
        border: 2px solid white;
        display: flex;
        justify-content: space-around;
    }
    body {
        background-color:cornflowerblue;
    }
</style>
<body>
    <div>
        <a href="https://www.youtube.com/watch?v=w81GvNtsKp8" target="_blank">
            <img class="img-destaque" src="f1.png" alt="Foto do Harry Potter">
        </a>
    </div>

    <div class="div-images">
        <a href="https://www.youtube.com/watch?v=U4sndXXtrtE" target="_blank">
            <img class="img-pequena" src="f2.png" alt="Foto de Stranger Things">
        </a>

        <a href="https://www.youtube.com/watch?v=xCwwxNbtK6Y" target="_blank">
            <img class="img-pequena" src="f3.png" alt="Foto do Cobra Kai">
        </a>

        <a href="https://www.youtube.com/watch?v=VhDjmg3v7ac" target="_blank">
            <img class="img-pequena" src="f4.png" alt="Foto da Barbie">
        </a>
    </div>
</body>
</html>
