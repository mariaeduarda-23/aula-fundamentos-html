<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria de Filmes e Séries</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background-color:#edf2f7;
    min-height:100vh;
    padding:40px;
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:35px;
    font-size:40px;
    text-shadow:2px 2px 6px rgba(0,0,0,.15);
}

.img-destaque{
    width:100%;
    max-height:500px;
    object-fit:cover;
    border-radius:25px;
    border:6px solid white;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    transition:0.4s;
    cursor:pointer;
}

.img-destaque:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow:0 18px 40px rgba(0,0,0,.35);
}

.div-images{
    margin-top:35px;
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.img-pequena{
    width:300px;
    height:260px;
    object-fit:cover;
    border-radius:20px;
    border:5px solid white;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
    transition:0.4s;
    cursor:pointer;
}

.img-pequena:hover{
    transform:scaleY(1.18) scaleX(1.05);
    box-shadow:0 18px 35px rgba(0,0,0,.35);
}

footer{
    text-align:center;
    color:#666;
    margin-top:40px;
    font-size:18px;
}
</style>

</head>
<body>

<h1>🎬 Galeria de Filmes e Séries</h1>

<div>
    <img class="img-destaque" src="f1.png" alt="Foto do Harry Potter">
</div>

<div class="div-images">
    <img class="img-pequena" src="f2.png" alt="Foto de Stranger Things">
    <img class="img-pequena" src="f3.png" alt="Foto de Cobra Kai">
    <img class="img-pequena" src="f4.png" alt="Foto da Barbie">
</div>

<footer>
    Desenvolvido por Maria Eduarda ❤️
</footer>

</body>
</html>
